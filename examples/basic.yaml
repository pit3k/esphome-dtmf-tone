esphome:
  name: dtmf-tone-example

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

external_components:
  - source: github://pit3k/esphome-dtmf-tone
    components: [dtmf_tone]

dtmf_tone:
  id: dtmf_gen
  pin_low: GPIO5
  pin_high: GPIO6
  carrier_frequency: 200000
  sample_rate: 32000
  amplitude: 100%
  high_tone_level: 80%

button:
  - platform: template
    name: "Play 1"
    on_press:
      - dtmf_tone.play:
          id: dtmf_gen
          sequence: "1"
          tone_length: 200ms
          inter_digit_gap: 80ms
